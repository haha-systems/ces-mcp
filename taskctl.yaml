# This is an example of taskctl tasks configuration file.
# More information at https://github.com/taskctl/taskctl
# pipelines:
#   pipeline1:
#     - task: task1
#     - task: task2
#       depends_on: task1

# watchers:
#   watcher1:
#     watch: ["README.*", "pkg/**/*.go"]
#     events: [create, write, remove, rename, chmod]
#     task: task1

tasks:
  fmt:
    allow_failure: true
    command:
      - golangci-lint fmt

  lint:
    allow_failure: true
    command:
      - golangci-lint run

  lint-fix:
    allow_failure: true
    command:
      - golangci-lint run --fix
      - go vet $(go list ./... | grep -v /vendor/)

  build:
    command: go build -o bin/ ./...
    env:
      GOOS: darwin
      GOARCH: arm64

  run:
    command: bin/ces-mcp
    env:
      CES_HTTP_ADDR: 0.0.0.0:4096
      CES_HTTP_PATH: /mcp
      CES_HTTP_BEARER_TOKEN: 6f87aae2132b877c8b4536a9269b20081629c6f0f8f96985d3cec68ef0e7daf9

pipelines:
  start:
    task: lint
    task: fmt
    task: build
    task: run
